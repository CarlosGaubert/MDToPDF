<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDToPDF - Estudio de Conversión Markdown a PDF</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Barra Superior -->
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div class="brand-info">
          <h1>MDToPDF</h1>
          <span class="brand-tag">Alta Fidelidad & Estética</span>
        </div>
      </div>

      <!-- Controles de Configuración -->
      <div class="header-controls">
        <div class="control-group">
          <label for="themeSelect">Tema:</label>
          <select id="themeSelect">
            <option value="modern" selected>Modern (Tech / Contemporáneo)</option>
            <option value="academic">Academic (Paper Formal)</option>
            <option value="editorial">Editorial (Revista / Libro)</option>
            <option value="minimal">Minimal (Suizo / B&W)</option>
            <option value="dark">Dark (Modo Oscuro Cyber)</option>
          </select>
        </div>

        <div class="control-group">
          <label for="formatSelect">Formato:</label>
          <select id="formatSelect">
            <option value="A4" selected>A4</option>
            <option value="Letter">Carta (Letter)</option>
            <option value="Legal">Oficio (Legal)</option>
          </select>
        </div>

        <div class="control-group checkbox-group">
          <label>
            <input type="checkbox" id="coverCheckbox">
            <span>Portada</span>
          </label>
        </div>

        <button id="loadSampleBtn" class="btn btn-secondary" title="Cargar documento de demostración completo">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Demo
        </button>

        <button id="exportPdfBtn" class="btn btn-primary" title="Compilar y descargar PDF de alta fidelidad">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span id="exportBtnText">Descargar PDF</span>
        </button>
      </div>
    </header>

    <!-- Espacio de Trabajo Dividido -->
    <main class="app-workspace">
      <!-- Panel Izquierdo: Editor -->
      <section class="pane pane-editor">
        <div class="pane-header">
          <div class="pane-title">
            <span class="dot"></span>
            EDITOR MARKDOWN
          </div>
          <div class="editor-actions">
            <label class="btn-file-upload" title="Cargar archivo .md desde tu computadora">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              Cargar .md
              <input type="file" id="fileInput" accept=".md,.markdown,.txt" style="display: none;">
            </label>
          </div>
        </div>
        <div class="editor-container">
          <textarea id="markdownInput" spellcheck="false" placeholder="Escribe o pega aquí tu código Markdown..."></textarea>
        </div>
        <div class="pane-footer">
          <span id="charCount">0 caracteres</span>
          <span id="wordCount">0 palabras</span>
          <span id="statusIndicator" class="status-ready">Listo</span>
        </div>
      </section>

      <!-- Panel Derecho: Vista Previa en Vivo -->
      <section class="pane pane-preview">
        <div class="pane-header">
          <div class="pane-title">
            <span class="dot live-dot"></span>
            VISTA PREVIA DE ALTA FIDELIDAD
          </div>
          <div class="preview-zoom-actions">
            <span class="badge-theme" id="activeThemeBadge">Tema: Modern</span>
          </div>
        </div>
        <div class="preview-container">
          <iframe id="previewIframe" title="Vista Previa de Impresión"></iframe>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
